<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status.running {
      background-color: #e8f5e8;
      color: #2d5a2d;
      border: 1px solid #4caf50;
    }
    .status.stopped {
      background-color: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
    }
    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .button.start {
      background-color: #4caf50;
      color: white;
    }
    .button.start:hover {
      background-color: #45a049;
    }
    .button.stop {
      background-color: #f44336;
      color: white;
    }
    .button.stop:hover {
      background-color: #da190b;
    }
    .button.download {
      background-color: #2196f3;
      color: white;
    }
    .button.download:hover {
      background-color: #1976d2;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      text-align: center;
    }
    .progress {
      margin: 10px 0;
      text-align: center;
    }
    .site-info {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      text-align: center;
      padding: 8px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>AI Chat Automator</h3>
  </div>
  
  <div id="status" class="status stopped">
    Ready to start
  </div>
  
  <div id="progress" class="progress" style="display: none;">
    <div id="progressText">Processing: 0/0</div>
  </div>
  
  <button id="startBtn" class="button start">Start Automation</button>
  <button id="stopBtn" class="button stop" style="display: none;">Stop Automation</button>
  <button id="downloadBtn" class="button download">Download Last Output</button>
  
  <div class="info">
    Click "Start Automation" to begin processing all prompts from prompts.json
  </div>
  
  <div class="site-info">
    Supports: DeepSeek Chat & OpenAI Chat
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
