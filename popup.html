<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status.running {
      background-color: #e8f5e8;
      color: #2d5a2d;
      border: 1px solid #4caf50;
    }
    .status.stopped {
      background-color: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
    }
    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .button.start {
      background-color: #4caf50;
      color: white;
    }
    .button.start:hover {
      background-color: #45a049;
    }
    .button.stop {
      background-color: #f44336;
      color: white;
    }
    .button.stop:hover {
      background-color: #da190b;
    }
    .button.download {
      background-color: #2196f3;
      color: white;
    }
    .button.download:hover {
      background-color: #1976d2;
    }
    .button.refresh {
      background-color: #ff9800;
      color: white;
    }
    .button.refresh:hover {
      background-color: #e68900;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      text-align: center;
    }
    .progress {
      margin: 10px 0;
      text-align: center;
    }
    .site-info {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      text-align: center;
      padding: 8px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }
    .prompt-source {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 5px;
    }
    .prompt-source label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    .radio-group {
      margin-bottom: 10px;
    }
    .radio-group input[type="radio"] {
      margin-right: 8px;
    }
    .radio-group label {
      display: inline;
      font-weight: normal;
      margin-right: 15px;
    }
    .batch-selector {
      margin-top: 10px;
      display: none;
    }
    .delay-settings {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
    }
    .delay-profile {
      margin-top: 8px;
      display: none;
    }
    .skip-settings {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
    }
    .skip-offset {
      margin-top: 8px;
      display: none;
    }
    .skip-offset select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      background-color: #fff;
    }
    .delay-profile select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      background-color: #fff;
    }
    .batch-selector select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    .batch-selector button {
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .batch-selector button:hover {
      background-color: #45a049;
    }
    .loading {
      color: #666;
      font-style: italic;
      font-size: 11px;
    }
    .delay-indicator {
      display: none;
      margin: 8px 0 12px;
      padding: 8px 10px;
      border: 1px solid #d7e8ff;
      background: #f3f8ff;
      border-radius: 5px;
      font-size: 12px;
      color: #1b4f9a;
      align-items: center;
      gap: 8px;
    }
    .delay-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #b7d2ff;
      border-top-color: #1b4f9a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>AI Chat Automator</h3>
  </div>
  
  <div class="prompt-source">
    <label>Prompt Source:</label>
    <div class="radio-group">
      <input type="radio" id="localPrompts" name="promptSource" value="local" checked>
      <label for="localPrompts">Local Prompts (prompts.json)</label>
    </div>
    <div class="radio-group">
      <input type="radio" id="automatedBatch" name="promptSource" value="batch">
      <label for="automatedBatch">Automated Batch</label>
    </div>
    
    <div id="batchSelector" class="batch-selector">
      <select id="batchSelect">
        <option value="">Select a batch...</option>
      </select>
      <button id="refreshBatches">Refresh Batches</button>
      <div id="batchLoading" class="loading" style="display: none;">Loading batches...</div>
    </div>

    <div class="delay-settings">
      <div class="radio-group">
        <input type="checkbox" id="delayExecutionEnabled">
        <label for="delayExecutionEnabled">Delay Execution (Add delay tactics to mimic user interactions)</label>
      </div>
      <div id="delayProfileContainer" class="delay-profile">
        <label for="delayProfileSelect">Delay Profile:</label>
        <select id="delayProfileSelect">
          <option value="conservative">Conservative (faster)</option>
          <option value="balanced">Balanced</option>
          <option value="aggressive_humanlike">Aggressive human-like</option>
        </select>
      </div>
    </div>

    <div class="skip-settings">
      <div class="radio-group">
        <input type="checkbox" id="skipPromptsEnabled">
        <label for="skipPromptsEnabled">Skip Prompts</label>
      </div>
      <div id="skipPromptsContainer" class="skip-offset">
        <label for="skipPromptsSelect">Start from prompt index:</label>
        <select id="skipPromptsSelect">
          <option value="0">0</option>
          <option value="20">20</option>
          <option value="40">40</option>
          <option value="60">60</option>
          <option value="80">80</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>
  </div>
  
  <div id="status" class="status stopped">
    Ready to start
  </div>
  
  <div id="progress" class="progress" style="display: none;">
    <div id="progressText">Processing: 0/0</div>
  </div>
  <div id="delayIndicator" class="delay-indicator">
    <span class="delay-spinner"></span>
    <span id="delayIndicatorText">Waiting before next prompt...</span>
  </div>
  
  <button id="startBtn" class="button start">Start Automation</button>
  <button id="stopBtn" class="button stop" style="display: none;">Stop Automation</button>
  <button id="downloadBtn" class="button download">Download Last Output</button>
  
  <div class="info">
    Click "Start Automation" to begin processing prompts
  </div>
  
  <div class="site-info">
    Supports: DeepSeek Chat & OpenAI Chat
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
